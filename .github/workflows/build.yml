name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log
      - name: api probe
        if: always()
        continue-on-error: true
        run: bash tools/ci/probe.sh
      - name: server smoke test
        run: |
          mkdir -p run-smoke && echo "eula=true" > run-smoke/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run-smoke/server.properties
          timeout 600 ./gradlew runSmoke --console=plain > smoke.log 2>&1 || true
          echo "=== SMOKE BEGIN"
          grep -E "DEADLINE-SMOKE|ERROR|Exception|Caused by|Couldn't|Failed to|Invalid|Unknown|missing" smoke.log | grep -vE "^\s+at " | head -150
          echo "=== SMOKE END"
          grep -q "DEADLINE-SMOKE DONE failures=0" smoke.log
      - name: client screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run/saves && rm -rf run/saves/smoke && cp -r run-smoke/world run/saves/smoke
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\nrenderDistance:8\nsimulationDistance:6\nmaxFps:30\nsoundCategory_master:0.0\ntutorialStep:none\nguiScale:2\nnarrator:0\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmoke --console=plain > client.log 2>&1 || true
          echo "=== CLIENT BEGIN"
          ls -la run/saves/smoke | head -20
          grep -iE "quick|saves|Preparing|level|world|DEADLINE-CLIENT|ERROR|Exception|Caused by|Crash" client.log | grep -vE "^\s+at |resource path" | cut -c1-400 | head -200
          echo "=== CLIENT END"
          python3 -m pip install -q pillow > /dev/null 2>&1 || true
          python3 tools/ci/shots.py run/screenshots
      - name: upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-mod
          path: build/libs/
      - name: error summary
        if: failure()
        run: |
          echo "=== ERRORS BEGIN"
          grep -E "error:|warning: \[|^\s+\^|\.java:[0-9]+|What went wrong|> Task .*FAILED|Exception|Caused by" build.log | grep -vE "^\s+at " | head -400
          echo "=== ERRORS END"
