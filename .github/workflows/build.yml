name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: chmod +x ./gradlew && ./gradlew build 
      - name: upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-mod
          path: build/libs/
