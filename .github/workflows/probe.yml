# Dev-only: prints vanilla 1.21.11 (Mojang-mapped) signatures/sources listed in tools/ci/probe-*.txt
name: api-probe
on:
  push:
    paths: ['tools/ci/**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: decompile
        run: chmod +x ./gradlew && ./gradlew genSources -q > /dev/null 2>&1
      - name: probe
        run: bash tools/ci/probe.sh
